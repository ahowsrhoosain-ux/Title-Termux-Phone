<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <rect width="100%" height="100%" fill="#070707" />
  <!-- subtle grid -->
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0%" stop-color="#061014" />
      <stop offset="100%" stop-color="#081214" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1280" height="640" fill="url(#g1)" opacity="0.9" />

  <!-- phone silhouette -->
  <g transform="translate(160,80)">
    <rect x="0" y="0" width="420" height="480" rx="36" ry="36" fill="#020202" stroke="#0f7a1a" stroke-width="4" />
    <rect x="28" y="40" width="364" height="320" rx="8" ry="8" fill="#051010" />
    <!-- terminal window inside phone -->
    <rect x="36" y="56" width="340" height="80" rx="6" ry="6" fill="#00110b" stroke="#073e1d" stroke-width="2" />
    <text x="56" y="108" fill="#39FF14" font-family="Arial, Helvetica, sans-serif" font-size="28">$ pkg install</text>
    <circle cx="210" cy="440" r="10" fill="#0f7a1a" />
  </g>

  <!-- neon terminal text title -->
  <text x="620" y="260" fill="#39FF14" font-family="Consolas, Monaco, monospace" font-size="64" font-weight="700">Title Termux Phone</text>
  <text x="620" y="320" fill="#91ffb4" font-family="Consolas, Monaco, monospace" font-size="20">Terminal-style preview for repository</text>

  <!-- accent lines -->
  <g stroke="#0f7a1a" stroke-width="2" opacity="0.25">
    <path d="M600 380 L1200 380" />
    <path d="M600 400 L1200 400" />
  </g>

  <!-- faint glow -->
  <circle cx="620" cy="260" r="220" fill="#39FF14" opacity="0.03" />
</svg>
